<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ERGA-SE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ERGA-SE">
<meta name="application-name" content="ERGA-SE">
<meta name="description" content="Sistema de evolução pessoal: missões diárias, treino, foco e estudo. Grátis.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Cinzel:wght@600;700;800&family=Chakra+Petch:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: coluna única de "janelas" holográficas do Sistema, barra de abas fixa embaixo (mobile-first). Tema escuro único, por escolha. */
:root{
  --void:#03060d;
  --deep:#071223;
  --panel:rgba(var(--p2),.74);
  --line:#2fb6ff;
  --glow:#8fe6ff;
  --ink:#e2f5ff;
  --dim:#7f9fbd;
  --faint:#1d3a57;
  --a1:47,182,255;--a2:79,200,255;--a3:143,230,255;--a4:120,90,255;--p1:14,40,78;--p2:8,26,52;--p3:3,10,22;--p4:3,8,18;
  --gold:#f4c95d;
  --blood:#ff3b5c;
  --ok:#5dffa8;
  --violet:#b48cff;
  --f-brand:'Audiowide','Chakra Petch',sans-serif;
  --f-disp:'Chakra Petch','Rajdhani','Segoe UI',system-ui,sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--void)}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100%;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(var(--a1),.18),transparent 70%),radial-gradient(ellipse 60% 40% at 100% 110%,rgba(var(--a4),.10),transparent 70%);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(var(--a3),.025) 0 1px,transparent 1px 3px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.app{position:relative;z-index:2;max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.mark{font-family:var(--f-disp);font-weight:700;letter-spacing:.32em;font-size:13px;color:var(--glow);text-shadow:0 0 12px rgba(var(--a1),.7)}
.mark small{display:block;letter-spacing:.14em;font-weight:500;color:var(--dim);font-size:10px;margin-top:2px}
.topr{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px}
.gold{color:var(--gold)}
.sync{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* janela */
.win{position:relative;background:linear-gradient(180deg,rgba(var(--p1),.82),var(--panel));border:1px solid rgba(var(--a2),.5);box-shadow:inset 0 0 28px rgba(var(--a1),.10),0 0 22px rgba(var(--a1),.14);padding:16px;margin-bottom:14px}
.win::before,.win::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--glow);pointer-events:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win.red{border-color:rgba(255,59,92,.6);background:linear-gradient(180deg,rgba(70,10,24,.85),rgba(40,6,16,.8));box-shadow:inset 0 0 30px rgba(255,59,92,.14),0 0 24px rgba(255,59,92,.2)}
.win.red::before,.win.red::after{border-color:#ff8da1}
.wh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wh .ic{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--glow);font-family:var(--f-disp);font-weight:700;color:var(--glow);box-shadow:0 0 10px rgba(var(--a1),.45)}
.red .wh .ic{border-color:#ff8da1;color:#ff8da1;box-shadow:0 0 10px rgba(255,59,92,.5)}
.wh h2{margin:0;font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.22em;text-transform:uppercase;text-wrap:balance}
.wh .sp{flex:1}
.sub{color:var(--dim);font-size:13px;margin:-4px 0 12px}
.hr{height:1px;background:linear-gradient(90deg,transparent,rgba(var(--a2),.45),transparent);margin:14px 0}
.lbl{font-family:var(--f-disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* status */
.who{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end}
.lv{font-family:var(--f-disp);font-weight:700;font-size:64px;line-height:.9;color:var(--ink);text-shadow:0 0 18px rgba(var(--a1),.8)}
.lv span{font-size:14px;letter-spacing:.2em;color:var(--dim);display:block;text-shadow:none;margin-bottom:4px}
.rank{width:64px;height:64px;display:grid;place-items:center;border:2px solid currentColor;font-family:var(--f-disp);font-weight:700;font-size:36px;box-shadow:0 0 16px currentColor inset,0 0 12px currentColor;text-shadow:0 0 10px currentColor}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:14px;font-size:14px}
.kv dt{font-family:var(--f-disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding-top:2px}
.kv dd{margin:0;min-width:0}
.kv select{background:var(--deep);border:1px solid var(--faint);padding:4px 8px;max-width:100%}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:12px}
.bar-row b{font-family:var(--f-disp);letter-spacing:.12em;font-weight:600}
.bar{height:9px;border:1px solid var(--faint);background:rgba(var(--a1),.06);overflow:hidden}
.bar i{display:block;height:100%;transition:width .5s}
.b-hp i{background:linear-gradient(90deg,#c21f43,var(--blood));box-shadow:0 0 10px var(--blood)}
.b-mp i{background:linear-gradient(90deg,#1c6fd6,var(--line));box-shadow:0 0 10px var(--line)}
.b-xp i{background:linear-gradient(90deg,#8a6a1c,var(--gold));box-shadow:0 0 10px var(--gold)}
.b-cp i{background:linear-gradient(90deg,#7a5cff,var(--glow));box-shadow:0 0 10px var(--glow)}
.b-fd i{background:linear-gradient(90deg,#3c3f55,#9aa2c7)}
.attrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.attr{display:flex;align-items:center;gap:10px;border:1px solid var(--faint);background:rgba(var(--p3),.45);padding:10px}
.attr .an{flex:1;min-width:0}
.attr .an b{display:block;font-family:var(--f-disp);font-weight:600;letter-spacing:.1em;font-size:13px}
.attr .an small{display:block;color:var(--dim);font-size:11px;line-height:1.3}
.attr .av{font-family:var(--f-mono);font-size:20px;font-weight:600}
.plus{width:30px;height:30px;border:1px solid var(--gold);background:rgba(244,201,93,.1);color:var(--gold);font-weight:700;display:grid;place-items:center}
.pts{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}
.pts .num{color:var(--gold);font-size:16px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chip{border:1px solid var(--faint);padding:8px;text-align:center;background:rgba(var(--p3),.4)}
.chip .num{display:block;font-size:18px;color:var(--ink)}
.chip small{color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-disp)}

/* botões */
.btn{border:1px solid var(--line);background:rgba(var(--a1),.12);padding:9px 14px;font-family:var(--f-disp);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--glow);transition:background .15s,box-shadow .15s}
.btn:hover{background:rgba(var(--a1),.22);box-shadow:0 0 14px rgba(var(--a1),.35)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.gh{border-color:var(--faint);background:transparent;color:var(--dim)}
.btn.dg{border-color:var(--blood);color:#ff8da1;background:rgba(255,59,92,.1)}
.btn.gd{border-color:var(--gold);color:var(--gold);background:rgba(244,201,93,.1)}
.btn.sm{padding:6px 10px;font-size:11px}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{width:100%;background:rgba(var(--p3),.7);border:1px solid var(--faint);padding:9px 10px;min-width:0}
.inp:focus{border-color:var(--line);outline:none;box-shadow:0 0 0 1px var(--line)}

/* missão diária */
.timer{font-family:var(--f-mono);font-size:13px;color:var(--glow);border:1px solid var(--faint);padding:3px 8px;white-space:nowrap}
.red .timer{color:#ff8da1}
.qi{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px dashed var(--faint)}
.qi:first-of-type{border-top:0}
.qi .qn{min-width:0;font-weight:500}
.qi .qn small{display:block;color:var(--dim);font-size:12px}
.qi .qv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.qi.done .qn{color:var(--ok)}
.qi.done .qv{color:var(--ok)}
.qbar{grid-column:1/-1;height:4px;background:rgba(var(--a1),.08)}
.qbar i{display:block;height:100%;background:var(--line);box-shadow:0 0 8px var(--line)}
.qi.done .qbar i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.red .qbar i{background:var(--blood);box-shadow:0 0 8px var(--blood)}
.ctr{grid-column:1/-1;display:flex;gap:6px}
.ctr button{flex:1;border:1px solid var(--faint);background:rgba(var(--p3),.5);padding:7px 0;font-family:var(--f-mono);font-size:13px}
.ctr button:hover{border-color:var(--line)}
.warn{margin-top:12px;font-size:13px;color:#ffb0bf;border-left:2px solid var(--blood);padding-left:10px}
.rew{margin-top:12px;font-size:13px;color:var(--dim)}
.rew b{color:var(--gold);font-weight:600}
.stamp{display:inline-block;font-family:var(--f-disp);font-weight:700;letter-spacing:.2em;color:var(--ok);border:1px solid var(--ok);padding:4px 10px;box-shadow:0 0 12px rgba(93,255,168,.35);font-size:12px}
.tag{font-family:var(--f-disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid currentColor;padding:2px 6px;white-space:nowrap}
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 56px 52px 32px;gap:6px;margin-bottom:6px;align-items:center}
.ed-row .inp{padding:7px 6px;font-size:13px}
.ed-h{font-size:10px;color:var(--dim);font-family:var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.dias{display:flex;gap:6px;flex-wrap:wrap}
.dias label{display:flex;align-items:center;gap:4px;border:1px solid var(--faint);padding:5px 8px;font-size:12px;cursor:pointer}
.dias input{accent-color:var(--line)}
.sq{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--faint)}
.sq:first-child{border-top:0}
.sq .sqn{flex:1;min-width:0;overflow-wrap:anywhere}
.sq.done .sqn{color:var(--dim);text-decoration:line-through}
.sq-form{display:grid;grid-template-columns:minmax(0,1fr) 70px auto;gap:8px}
.sq-form select{background:rgba(var(--p3),.7);border:1px solid var(--faint);padding:0 6px}

/* portais */
.gates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gate{position:relative;border:1px solid var(--faint);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,currentColor 22%,transparent),rgba(var(--p3),.6) 65%);padding:14px 8px 10px;text-align:center;color:var(--ink)}
.gate:hover{border-color:currentColor;box-shadow:0 0 16px color-mix(in srgb,currentColor 40%,transparent)}
.gate .gl{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1;text-shadow:0 0 14px currentColor}
.gate .gm{display:block;font-family:var(--f-mono);font-size:12px;color:var(--ink);margin-top:6px}
.gate .gx{display:block;font-size:11px;color:var(--dim)}
.ring{display:grid;place-items:center;position:relative;margin:4px auto 10px;width:min(240px,70vw);max-width:100%;aspect-ratio:1}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{text-align:center}
.ring .rt b{display:block;font-family:var(--f-mono);font-size:34px;font-weight:600;text-shadow:0 0 12px rgba(var(--a1),.7)}
.ring .rt small{color:var(--dim);font-family:var(--f-disp);letter-spacing:.2em;font-size:11px}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

/* loja */
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--faint)}
.it:first-child{border-top:0}
.it .gem{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid currentColor;font-family:var(--f-disp);font-weight:700;box-shadow:0 0 10px color-mix(in srgb,currentColor 45%,transparent) inset}
.it .itn{flex:1;min-width:0}
.it .itn b{display:block;font-weight:600;overflow-wrap:anywhere}
.it .itn small{display:block;color:var(--dim);font-size:12px}
.it .q{font-family:var(--f-mono);color:var(--dim);font-size:13px}
.ex{color:var(--dim);font-size:10px;border:1px solid var(--faint);padding:1px 5px;margin-left:6px;font-family:var(--f-disp);letter-spacing:.1em;vertical-align:middle}

/* registro */
.lg{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:8px 0;border-top:1px dashed var(--faint);font-size:13px}
.lg:first-child{border-top:0}
.lg time{font-family:var(--f-mono);color:var(--dim);font-size:11px;padding-top:2px}
.lg span{min-width:0;overflow-wrap:anywhere}
.lg.alerta span{color:#ffb0bf}
.lg.lvl span,.lg.titulo span{color:var(--gold)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:16px 0}

/* juramento de 100 dias */
.jv{border:1px solid var(--faint);background:rgba(var(--p3),.45);padding:12px;display:grid;gap:10px}
.jv+.jv{margin-top:10px}
.jv.ok{border-color:rgba(93,255,168,.5)}
.jv-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.jv-n{min-width:0}
.jv-n b{display:block;font-weight:600;overflow-wrap:anywhere}
.jv-n small{color:var(--dim);font-size:12px}
.jv-d{flex:none;text-align:right;font-family:var(--f-disp);line-height:1}
.jv-d .num{font-size:30px;font-weight:600;color:var(--gold);text-shadow:0 0 12px rgba(244,201,93,.55)}
.jv.ok .jv-d .num{color:var(--ok);text-shadow:0 0 12px rgba(93,255,168,.5)}
.jv-d small{color:var(--dim);font-size:12px;margin-left:2px}
.g100{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.g100 i{display:block;aspect-ratio:1;max-width:100%;border:1px solid var(--faint);background:rgba(var(--a1),.04)}
.g100 i.m{border-color:rgba(var(--a1),.35)}
.g100 i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(244,201,93,.6)}
.jv.ok .g100 i.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 6px rgba(93,255,168,.5)}
.g100 i.hj{border-color:var(--glow);box-shadow:0 0 6px rgba(var(--a3),.6);animation:pulse 2.4s ease-in-out infinite}
.jv .warn{margin-top:0}

/* ensinamentos */
.iki{display:grid;gap:10px}
.iki-f{font-family:var(--f-disp);font-size:18px;line-height:1.35;color:var(--glow);text-shadow:0 0 12px rgba(var(--a1),.45);text-wrap:balance;border-left:2px solid var(--glow);padding-left:12px}
.iki-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.iki-g div{border:1px solid var(--faint);background:rgba(var(--p3),.45);padding:8px 10px;min-width:0}
.iki-g small{display:block;font-family:var(--f-disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.iki-g span{font-size:13px;overflow-wrap:anywhere}
.iki-form{display:grid;gap:8px}
.iki-form label{font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.cmp{display:grid;gap:12px}
.cmp-r{display:grid;gap:4px}
.cmp-h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cmp-h b{font-weight:500}
.cmp-h .up{color:var(--ok)}.cmp-h .dn{color:#ff8da1}.cmp-h .eq{color:var(--dim)}
.cmp-b{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:11px;color:var(--dim)}
.cmp-b .bar{height:7px}
.cmp-b .agora i{background:linear-gradient(90deg,#1c6fd6,var(--line));box-shadow:0 0 8px var(--line)}
.cmp-b .antes i{background:rgba(var(--a1),.28)}
.ens{display:grid}
.ens div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:9px 0;border-top:1px dashed var(--faint)}
.ens div:first-child{border-top:0}
.ens .kj{grid-row:span 2;font-size:20px;color:var(--gold);min-width:2.2em;text-align:center;text-shadow:0 0 10px rgba(244,201,93,.45)}
.ens b{font-weight:600}
.ens small{color:var(--dim);font-size:12px}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.sug .lbl{margin-right:2px}

/* temas */
:root[data-tema="monarca"]{--void:#07040f;--deep:#120a24;--line:#9b6bff;--glow:#cdb4ff;--dim:#9a8bbd;--faint:#2c2150;--a1:155,107,255;--a2:175,135,255;--a3:205,180,255;--a4:255,90,200;--p1:40,22,78;--p2:24,14,50;--p3:10,5,22;--p4:8,4,18}
:root[data-tema="brasa"]{--void:#0d0503;--deep:#1f0c06;--line:#ff7a2f;--glow:#ffc08f;--dim:#bd957f;--faint:#4a2414;--a1:255,122,47;--a2:255,150,80;--a3:255,192,143;--a4:255,59,92;--p1:78,30,14;--p2:52,20,8;--p3:22,8,3;--p4:18,6,3}
:root[data-tema="jade"]{--void:#020a07;--deep:#06180f;--line:#2fe39a;--glow:#9bffd2;--dim:#7fb59c;--faint:#17402f;--a1:47,227,154;--a2:79,235,175;--a3:155,255,210;--a4:47,182,255;--p1:12,60,40;--p2:8,40,27;--p3:3,18,12;--p4:3,14,9}
:root[data-tema="aco"]{--void:#08090b;--deep:#121418;--line:#c9d1dc;--glow:#ffffff;--dim:#8a93a0;--faint:#2b3038;--a1:201,209,220;--a2:215,222,232;--a3:240,244,250;--a4:140,150,170;--p1:34,38,46;--p2:24,27,33;--p3:12,13,16;--p4:10,11,13}
.temas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.temas button{border:1px solid var(--faint);background:rgba(var(--p3),.5);padding:8px 4px;display:grid;gap:6px;justify-items:center;font-size:11px;color:var(--ink);min-width:0}
.temas button[aria-pressed="true"]{border-color:var(--glow);box-shadow:0 0 10px rgba(var(--a1),.45)}
.temas i{width:26px;height:26px;border-radius:50%;display:block}
/* seções recolhíveis */
details.fold>summary{list-style:none;cursor:pointer;margin-bottom:0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-family:var(--f-mono);color:var(--dim);font-size:16px;margin-left:auto;padding-left:8px}
details.fold[open]>summary{margin-bottom:12px}
details.fold[open]>summary::after{content:"−"}
details.fold>summary .sp{display:none}
.carta-l{margin:0 0 12px;padding:8px 10px;border-left:2px solid var(--gold);background:rgba(244,201,93,.06);font-size:14px;line-height:1.45}
.carta-l .tag{color:var(--gold);margin-right:6px}
/* arquiteto */
.arq-chat{display:grid;gap:10px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{justify-self:end;background:rgba(var(--a1),.14);border:1px solid rgba(var(--a2),.35)}
.msg.a{justify-self:start;background:rgba(var(--p3),.7);border:1px solid var(--faint);border-left:2px solid var(--glow)}
.msg.a b{display:block;font-family:var(--f-disp);font-size:10px;letter-spacing:.18em;color:var(--glow);margin-bottom:4px}
.msg.wait{color:var(--dim)}
.arq-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.prop{display:grid;gap:8px;margin-top:12px}
.prop .sq{border-top:1px dashed var(--faint)}
.veredito{border:1px solid var(--faint);padding:10px;font-size:14px;margin-top:10px}
.veredito.lim{border-color:var(--ok)}
.veredito.desc{border-color:#ff8da1}

/* abertura */
.ov.gate{background:var(--void);backdrop-filter:none}
.gate-full{position:absolute;inset:0;width:100%;background:none;border:0;color:var(--dim);font-family:var(--f-disp);font-size:13px;letter-spacing:.38em;text-transform:uppercase;display:grid;place-items:center;cursor:pointer;z-index:2}
.gate-mark.revela{animation:revela 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes revela{0%{opacity:0;transform:scale(1.6);filter:blur(10px) brightness(2.5)}35%{opacity:1;filter:blur(0) brightness(1.8)}100%{opacity:1;transform:scale(1);filter:none}}
.ov.gate::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 50% 40%,rgba(var(--a1),.16),transparent 70%)}
.gate-c{position:relative;display:grid;gap:18px;justify-items:center;width:min(460px,100%)}
.gate-mark{font-family:var(--f-disp);font-weight:700;letter-spacing:.55em;padding-left:.55em;font-size:26px;color:var(--glow);text-shadow:0 0 18px rgba(var(--a1),.9)}
.gate-tap{border:1px solid var(--line);background:rgba(var(--a1),.08);color:var(--glow);font-family:var(--f-disp);letter-spacing:.3em;text-transform:uppercase;font-size:13px;padding:16px 22px;box-shadow:0 0 22px rgba(var(--a1),.25)}
.gate-vol{color:var(--dim);font-size:12px;letter-spacing:.06em}
.tw-box{display:grid;gap:10px;width:100%;text-align:left;min-height:180px}
.tw{font-family:var(--f-mono);font-size:14px;line-height:1.5;color:var(--ink);margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tw.big{font-family:var(--f-disp);font-size:20px;line-height:1.35;color:var(--glow);text-shadow:0 0 12px rgba(var(--a1),.6)}
.tw.dim{color:var(--dim)}
.tw.on::after{content:"▌";color:var(--glow);animation:pulse 1s steps(2) infinite;margin-left:1px}
.scan{height:6px;border:1px solid var(--faint);background:rgba(var(--a1),.05);overflow:hidden}
.scan i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 10px var(--line);transition:width 1.6s cubic-bezier(.4,0,.2,1)}
.gate-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity .6s}
.gate-act.on{opacity:1}
.gate-skip{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:none;border:0;color:var(--dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase;z-index:2}
.flash{animation:flash .5s ease-out}
@keyframes flash{0%{filter:brightness(2.4) saturate(1.6)}100%{filter:none}}
/* descoberta (ikigai adaptativo) */
.desc{border:1px dashed rgba(var(--a2),.5);padding:12px;display:grid;gap:10px;margin-top:4px}
.desc p{margin:0}
.desc-q{display:grid;gap:6px}
.desc-q li{font-size:14px}
.desc ol{margin:0;padding-left:20px;display:grid;gap:6px}
.chips-s{display:flex;flex-wrap:wrap;gap:6px}

/* microanimações */
.bar i.anim{animation:fillxp 1s cubic-bezier(.2,.8,.2,1)}
@keyframes fillxp{from{width:var(--de)}}
.app.lvlup .win:first-of-type{animation:lvglow 1.6s ease-out}
@keyframes lvglow{0%{box-shadow:0 0 0 rgba(244,201,93,0)}25%{box-shadow:0 0 40px rgba(244,201,93,.85),inset 0 0 30px rgba(244,201,93,.35)}100%{box-shadow:inset 0 0 28px rgba(var(--a1),.10),0 0 22px rgba(var(--a1),.14)}}
.ov .win.red{animation:winOpen .42s cubic-bezier(.2,.8,.2,1),tremor .5s .42s}
@keyframes tremor{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
/* aviso de erro contido */
.erro-box{position:fixed;left:0;right:0;top:0;z-index:80;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(70,10,24,.96);border-bottom:1px solid var(--blood);color:#ffd5dc;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.erro-box span{flex:1;min-width:0}
.erro-box button{background:none;border:1px solid #ff8da1;color:#ff8da1;padding:4px 8px;font-size:12px}
/* classe no despertar */
.gate-cls{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%}
.gate-cls button{text-align:left;border:1px solid var(--faint);background:rgba(var(--p3),.6);padding:10px;color:var(--ink);display:grid;gap:2px;min-width:0}
.gate-cls button b{font-family:var(--f-disp);letter-spacing:.08em;color:var(--gold)}
.gate-cls button small{color:var(--dim);font-size:11px;line-height:1.3}
.gate-cls button[aria-pressed="true"]{border-color:var(--glow);box-shadow:0 0 14px rgba(var(--a1),.45)}
.gate-c textarea{width:100%}

.lang-b{border:1px solid var(--faint);background:rgba(var(--p3),.6);color:var(--glow);font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;padding:4px 8px}
.btn,.plus,.gate,.gate-tap,.temas button,.cls button,.gate-cls button,.ctr button,nav.tabs a,.lang-b{transition:transform .08s ease-out,background .15s,box-shadow .15s}
.btn:active,.plus:active,.gate:active,.gate-tap:active,.temas button:active,.cls button:active,.gate-cls button:active,.ctr button:active,.lang-b:active{transform:scale(.96)}
nav.tabs a:active svg{transform:scale(.88)}
#main.entra>*{animation:entra .32s cubic-bezier(.2,.8,.2,1) both}
#main.entra>*:nth-child(2){animation-delay:.04s}#main.entra>*:nth-child(3){animation-delay:.08s}#main.entra>*:nth-child(n+4){animation-delay:.12s}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ranking */
.rk-me{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.rk-list{display:grid}
.exr{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-top:1px dashed var(--faint);font-size:14px}.exr b{font-family:var(--f-mono);font-weight:500}.exr.ok{color:var(--ok)}.exr.ok b::after{content:' ✓'}
.ex-f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.ex-f label{display:grid;gap:4px;font-size:12px;color:var(--dim)}
.rk-row{display:grid;grid-template-columns:34px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px dashed var(--faint)}
.rk-row:first-child{border-top:0}
.rk-row .ps{font-family:var(--f-mono);color:var(--dim);text-align:right}
.rk-row .bd{width:30px;height:30px;display:grid;place-items:center;border:1px solid currentColor;font-family:var(--f-disp);font-weight:700;font-size:14px}
.rk-row .nm{min-width:0}
.rk-row .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.rk-row .nm small{color:var(--dim);font-size:11px;font-family:var(--f-mono)}
.rk-row .xp{font-family:var(--f-mono);font-size:13px;color:var(--gold);text-align:right}
.rk-row.eu{background:rgba(var(--a1),.12);border:1px solid rgba(var(--a2),.5)}
.rk-row.eu .ps{color:var(--glow)}
.rk-row:nth-child(1) .ps{color:var(--gold)}
.rk-gap{font-size:13px;color:var(--dim);display:grid;gap:4px;margin-top:10px}
.rk-gap b{color:var(--ink)}
.code-box{font-family:var(--f-mono);font-size:11px;word-break:break-all;background:rgba(var(--p3),.7);border:1px solid var(--faint);padding:8px;max-height:84px;overflow:auto;user-select:all}
/* configurações */
.cfg-back{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cfg-g{display:grid;gap:10px}
.cfg-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--faint);font-size:14px}
.cfg-r:first-child{border-top:0}
.cfg-r span{min-width:0}
.cfg-r small{display:block;color:var(--dim);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--faint)}
.seg button{background:none;border:0;padding:6px 12px;color:var(--dim);font-family:var(--f-disp);font-size:12px;letter-spacing:.1em}
.seg button[aria-pressed="true"]{background:rgba(var(--a1),.18);color:var(--glow)}
.gear{background:none;border:1px solid var(--faint);color:var(--dim);width:30px;height:28px;display:grid;place-items:center;font-size:15px}
.gear[aria-pressed="true"]{color:var(--glow);border-color:var(--line)}
.win.perigo{border-color:rgba(255,59,92,.4)}
/* estudo e prova */
.mat-sel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:10px}
.mat-sel select{background:rgba(var(--p3),.7);border:1px solid var(--faint);padding:9px 8px;color:var(--ink);min-width:0}
.ass{display:grid}
.ass-r{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--faint);font-size:14px}
.ass-r:first-child{border-top:0}
.ass-r .ck{color:var(--ok);text-align:center}
.ass-r.ok .tx{color:var(--dim)}
.prova{display:grid;gap:16px}
.pq{display:grid;gap:8px}
.pq p{margin:0;font-size:15px;line-height:1.45}
.pq .alts{display:grid;gap:6px}
.pq .alts button{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--faint);background:rgba(var(--p3),.55);padding:10px;color:var(--ink);font-size:14px;line-height:1.4}
.pq .alts button b{font-family:var(--f-disp);color:var(--dim)}
.pq .alts button[aria-pressed="true"]{border-color:var(--line);background:rgba(var(--a1),.16)}
.pq .alts button[aria-pressed="true"] b{color:var(--glow)}
.pq .alts button.certa{border-color:var(--ok);background:rgba(93,255,168,.12)}
.pq .alts button.errada{border-color:var(--blood);background:rgba(255,59,92,.12)}
.pq .exp{font-size:13px;color:var(--dim);border-left:2px solid var(--faint);padding-left:10px}
.nota{font-family:var(--f-disp);font-size:28px;font-weight:700}

.cls-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cls-b{display:grid;justify-items:center;gap:6px;border:1px solid var(--faint);background:rgba(var(--p3),.55);padding:10px 2px 8px;color:var(--ink);font-family:var(--f-disp);font-size:10px;letter-spacing:.04em;min-width:0}
.cls-b svg{color:var(--glow)}
.cls-b[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(244,201,93,.35)}
.cls-b[aria-pressed="true"] svg{color:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
.cls-info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--faint);padding:12px;background:rgba(var(--p3),.6);margin-top:10px;text-align:left}
.cls-info b{font-family:var(--f-disp);letter-spacing:.08em;color:var(--gold)}
.cls-info p{margin:4px 0 0;font-size:13px;line-height:1.4}
.cls-info .dim{color:var(--dim)}
.cls-ic{color:var(--gold);filter:drop-shadow(0 0 8px currentColor)}

/* emblema de rank */
.sig{width:80px;height:80px;flex:none;filter:drop-shadow(0 0 7px currentColor)}
.sig text{font-family:var(--f-disp);font-weight:700;fill:currentColor}
.sig .spin{transform-origin:50px 50px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* avaliação */
.av{display:grid;gap:10px}
.av-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.av label{display:grid;gap:4px;font-family:var(--f-disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);min-width:0}
.av select{background:rgba(var(--p3),.7);border:1px solid var(--faint);padding:9px 8px;min-width:0;width:100%;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:14px;color:var(--ink)}
.av .inp{text-transform:none;letter-spacing:0;font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.rel{display:grid;gap:10px}
.rel-h{display:flex;align-items:center;gap:14px}
.rel-h .big{font-family:var(--f-disp);font-weight:700;font-size:40px;line-height:1;text-shadow:0 0 14px currentColor}
.rel-h p{margin:0;font-size:13px;color:var(--dim)}
.rel-l{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.rel-l dt{font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding-top:2px}
.rel-l dd{margin:0;min-width:0}
.plano{border:1px dashed var(--faint);padding:10px;display:grid;gap:4px;font-size:13px}
.plano div{display:flex;justify-content:space-between;gap:10px}

/* carta do dia */
.carta{border-color:rgba(244,201,93,.45)}
.carta .wh .ic{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(244,201,93,.45)}
.carta blockquote{margin:0;font-family:var(--f-disp);font-size:17px;line-height:1.4;text-wrap:balance}

/* questões */
.qf{display:grid;grid-template-columns:minmax(0,1fr) 68px 68px;gap:8px;align-items:end}
.qf label{display:grid;gap:4px;font-family:var(--f-disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);min-width:0}
.qf select{background:rgba(var(--p3),.7);border:1px solid var(--faint);padding:9px 6px;min-width:0;width:100%;color:var(--ink);font-family:var(--f-body);font-size:14px;text-transform:none;letter-spacing:0}
.qf .inp{font-family:var(--f-mono)}
.mt{display:grid;gap:8px}
.mt-r{display:grid;grid-template-columns:minmax(0,1fr) 44px 46px;gap:4px 10px;align-items:center;font-size:13px}
.mt-r .nm{min-width:0;overflow-wrap:anywhere}
.mt-r .bar{grid-column:1/-1;height:5px}
.mt-r .bar i{display:block;height:100%}
.mt-r.hi .bar i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.mt-r.md .bar i{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.mt-r.lo .bar i{background:var(--blood);box-shadow:0 0 6px var(--blood)}
.mt-r .pc{text-align:right;font-family:var(--f-mono)}
.mt-r.lo .pc{color:#ff8da1}.mt-r.hi .pc{color:var(--ok)}

/* chefe semanal */
.boss{border-color:rgba(255,59,92,.45)}
.boss .wh .ic{border-color:#ff8da1;color:#ff8da1;box-shadow:0 0 10px rgba(255,59,92,.45)}
.boss-n{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.04em;margin:0;text-wrap:balance}
.boss-d{color:var(--dim);font-size:13px;margin:2px 0 12px}
.boss .bar{height:12px}
.boss-hp{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;color:var(--dim)}
.dmg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dmg span{font-size:11px;border:1px solid var(--faint);padding:3px 7px;color:var(--dim)}
.dmg b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
/* iniciação */
.ini{display:grid}
.ini div{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--faint);font-size:14px}
.ini div:first-child{border-top:0}
.ini .ck{flex:none;width:20px;height:20px;border:1px solid var(--faint);display:grid;place-items:center;font-size:12px;color:var(--ok)}
.ini .ok .ck{border-color:var(--ok);box-shadow:0 0 8px rgba(93,255,168,.4)}
.ini .tx{flex:1;min-width:0}
.ini .tx small{display:block;color:var(--dim);font-size:12px}
.ini .ok .tx{color:var(--dim)}
.selo{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--faint);padding:10px;margin:-4px 0 14px;font-size:13px;cursor:pointer}
.selo input{accent-color:var(--blood);margin-top:2px}
.selo small{display:block;color:var(--dim)}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mats label{display:flex;align-items:center;gap:6px;border:1px solid var(--faint);padding:6px 9px;font-family:var(--f-body);font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer}
.mats input{accent-color:var(--line)}
.mats label:has(input:checked){border-color:var(--line);background:rgba(var(--a1),.12)}
.av fieldset{border:1px solid var(--faint);padding:10px;margin:0;display:grid;gap:10px;min-width:0}
.av legend{font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:0 4px}
.iki-g span.vz{color:var(--dim);font-style:italic}
.st-ok{color:var(--ok);font-size:12px}
.rd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rd label{display:grid;gap:3px;font-family:var(--f-disp);font-size:10px;letter-spacing:.1em;color:var(--dim);min-width:0}
.rd select{background:rgba(var(--p3),.7);border:1px solid var(--faint);padding:8px 2px;min-width:0;width:100%;color:var(--ink);font-family:var(--f-mono);font-size:13px}
.rdn{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--faint);font-size:13px}
.rdn:first-child{border-top:0}
.rdn time{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.rdn span{min-width:0;overflow-wrap:anywhere}
.rdn b{font-family:var(--f-mono);font-size:16px;color:var(--gold)}
.rdn small{grid-column:2/-1;color:var(--dim);font-family:var(--f-mono);font-size:11px}
.lem{display:grid;gap:10px}
.lem div{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center}
.lem span{font-size:14px;min-width:0}
.lem span small{display:block;color:var(--dim);font-size:12px}
.lem .inp{padding:7px 6px;font-family:var(--f-mono)}
a.btn{text-decoration:none;display:inline-block;text-align:center}
@media (max-width:420px){.lem div{grid-template-columns:minmax(0,1fr) 84px}.lem div a{grid-column:1/-1}}
@media (max-width:420px){.av-g{grid-template-columns:minmax(0,1fr)}}

/* títulos */
.tits{display:grid;gap:6px}
.tit{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px dashed var(--faint)}
.tit:first-child{border-top:0}
.tit b{font-weight:600}
.tit.lk{color:var(--dim)}
.tit small{color:var(--dim);text-align:right}
.cls{display:grid;gap:8px}
.cls button{text-align:left;border:1px solid var(--faint);background:rgba(var(--p3),.5);padding:10px 12px}

.lv-r{flex:1;min-width:120px;font-size:12px;color:var(--dim)}.lv-r.go{color:var(--ok);font-weight:600}
.cr-up{display:inline-block;cursor:pointer}
.ev-a{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev-a button{border:1px solid var(--faint);background:transparent;color:var(--dim);border-radius:6px;padding:3px 8px;font-size:11px;font-family:var(--f-disp)}
.ev-a button.on{border-color:var(--gold);color:var(--gold)}
.wiz .win{width:min(480px,100%);max-height:calc(100dvh - 40px);display:flex;flex-direction:column;margin:0}
.wz-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wz-p{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin:8px 0 12px;overflow:hidden}.wz-p i{display:block;height:100%;background:var(--glow);box-shadow:0 0 8px var(--glow);transition:width .3s}
.wz-b{overflow:auto;min-height:0;flex:1}
.wz-b h3{margin:0 0 4px;font-family:'Cinzel',var(--f-disp),serif;font-size:20px;letter-spacing:.06em;color:var(--glow)}
.wz-b h4{margin:14px 0 6px;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.wz-s{margin:0 0 10px;color:var(--dim);font-size:13px;line-height:1.45}
.wz-ch{display:flex;flex-wrap:wrap;gap:6px}.wz-ch.col{display:grid}
.wz-c{border:1px solid var(--faint);background:rgba(255,255,255,.02);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px;text-align:left}
.wz-c.on{border-color:var(--glow);color:var(--glow);background:rgba(var(--a1),.12);box-shadow:0 0 10px rgba(var(--a1),.25)}
.wz-st{display:grid;grid-template-columns:minmax(0,1fr) 40px 56px 40px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--faint)}
.wz-st span{font-size:13px}.wz-st b{text-align:center;font-size:20px}
.wz-st button{height:40px;border-radius:10px;border:1px solid var(--faint);background:rgba(255,255,255,.03);color:var(--ink);font-size:20px}
.wz-g label{font-family:var(--f-disp);font-size:11px;letter-spacing:.1em;color:var(--dim);display:grid;gap:4px;text-transform:uppercase}
.wz-r{display:grid;gap:2px;padding:10px 0;border-bottom:1px dashed var(--faint)}.wz-r b{font-family:var(--f-disp);font-size:12px;letter-spacing:.1em;color:var(--glow);text-transform:uppercase}.wz-r span{font-size:13px;line-height:1.45}
.wz-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.mac-b{grid-column:1/-1;justify-self:start;margin-top:4px}
.ens-t{margin:6px 0 4px;text-align:center;font-family:'Cinzel',Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 16px rgba(246,183,60,.35)}
.ens-l{display:grid;gap:10px;margin-top:10px}
.ens-l>div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.02);opacity:0;animation:ensIn .7s ease-out forwards}
.ens-l .kj{font-size:19px;white-space:nowrap;text-align:center;color:var(--gold);font-family:serif;line-height:1.1}
.ens-d{display:block;font-style:normal;color:var(--dim);font-size:12px;line-height:1.45;margin-top:5px;padding-top:5px;border-top:1px dashed rgba(255,255,255,.1)}
.ens-l b{display:block;font-family:'Cinzel',Georgia,serif;letter-spacing:.06em;color:var(--glow)}.ens-l small{display:block;color:var(--ink);font-size:13px;line-height:1.4;margin-top:2px}
@keyframes ensIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h3.jt{margin:6px 0 8px;font-family:var(--f-disp);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.qi-t .qn small{white-space:normal}
.fixo{margin:0;font-size:12px;color:var(--gold);letter-spacing:.02em}
.jur-f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.jur-f .inp{grid-column:1/-1}.jur-f select{background:#0d0d10;border:1px solid var(--faint);border-radius:8px;padding:8px;color:var(--ink);min-width:0}
.jur-f select#jur-tipo{grid-column:1/-1}
.ck.tm{width:auto;min-width:40px;padding:0 6px;font-size:11px;border-color:var(--gold);color:var(--gold);font-family:var(--f-mono);white-space:nowrap}
.ck.run{width:auto;min-width:40px;padding:0 6px;font-size:12px;color:var(--glow);border-color:var(--glow);font-family:var(--f-mono);opacity:1}
.ck:disabled{cursor:not-allowed}
.tx-g{grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) auto}.tx-g.nw{grid-template-columns:40px minmax(0,1fr) auto}
/* proposta do Arquiteto */
.sys{border:1px solid rgba(var(--a2),.4);border-radius:12px;padding:12px;background:rgba(var(--p4),.6);font-family:var(--f-mono);font-size:13px}
.sys-h{color:var(--glow);letter-spacing:.08em;font-weight:600}
.sys-e{margin:4px 0 6px;color:var(--ink)}
.sys .sq{font-family:var(--f-body)}
.sys .sqn small{display:block;color:var(--gold);font-family:var(--f-mono);font-size:11px;margin-top:2px}
.sys-q{margin:8px 0 0;border-left:2px solid var(--glow);padding:6px 10px;color:var(--dim);font-style:italic;font-size:12px;background:rgba(var(--a1),.06);border-radius:0 8px 8px 0}
.sq .atg{font-family:var(--f-disp);font-size:10px;letter-spacing:.1em;color:var(--violet);margin-left:6px}
nav.tabs .in{grid-template-columns:repeat(7,minmax(0,1fr))}
nav.tabs a{font-size:8.5px!important;letter-spacing:.04em!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){
  .lv{font-size:54px}
  .gates{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ed-row{grid-template-columns:minmax(0,1fr) 54px 46px 46px 30px}
}

/* ===== tema Sistema (padrão): janelas holográficas do Sistema ===== */
:root[data-tema="sistema"]{--void:#010309;--deep:#040b18;--line:#3fb8ff;--glow:#a6e6ff;--ink:#eaf7ff;--dim:#86a3c0;--faint:#143454;--a1:63,184,255;--a2:96,204,255;--a3:166,230,255;--a4:124,92,255;--p1:8,22,44;--p2:5,14,30;--p3:3,9,20;--p4:2,5,12;--gold:#ffd166;--cn:#bfefff}

@keyframes sysScan{to{transform:translateY(650%)}}
:root[data-tema="sistema"] .win{border-radius:0;border:1px solid rgba(96,204,255,.42);background:linear-gradient(var(--cn),var(--cn)) top left/16px 2px no-repeat,linear-gradient(var(--cn),var(--cn)) top left/2px 16px no-repeat,linear-gradient(var(--cn),var(--cn)) top right/16px 2px no-repeat,linear-gradient(var(--cn),var(--cn)) top right/2px 16px no-repeat,linear-gradient(var(--cn),var(--cn)) bottom left/16px 2px no-repeat,linear-gradient(var(--cn),var(--cn)) bottom left/2px 16px no-repeat,linear-gradient(var(--cn),var(--cn)) bottom right/16px 2px no-repeat,linear-gradient(var(--cn),var(--cn)) bottom right/2px 16px no-repeat,linear-gradient(180deg,rgba(12,36,70,.74),rgba(3,11,26,.9));box-shadow:0 0 24px rgba(63,184,255,.22),inset 0 0 36px rgba(63,184,255,.10),inset 0 1px 0 rgba(166,230,255,.18)}

:root[data-tema="sistema"] .win.red,:root[data-tema="sistema"] .win.boss{--cn:#ff8fa3;border-color:rgba(255,92,122,.55);background:linear-gradient(var(--cn),var(--cn)) top left/16px 2px no-repeat,linear-gradient(var(--cn),var(--cn)) top left/2px 16px no-repeat,linear-gradient(var(--cn),var(--cn)) top right/16px 2px no-repeat,linear-gradient(var(--cn),var(--cn)) top right/2px 16px no-repeat,linear-gradient(var(--cn),var(--cn)) bottom left/16px 2px no-repeat,linear-gradient(var(--cn),var(--cn)) bottom left/2px 16px no-repeat,linear-gradient(var(--cn),var(--cn)) bottom right/16px 2px no-repeat,linear-gradient(var(--cn),var(--cn)) bottom right/2px 16px no-repeat,linear-gradient(180deg,rgba(64,8,22,.78),rgba(22,3,10,.9));box-shadow:0 0 26px rgba(255,59,92,.25),inset 0 0 36px rgba(255,59,92,.10)}
:root[data-tema="sistema"] .wh h2{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.3em;color:#fff;text-shadow:0 0 8px rgba(120,214,255,.95),0 0 22px rgba(63,184,255,.55);padding:5px 12px;border:1px solid rgba(120,214,255,.55);background:linear-gradient(90deg,rgba(63,184,255,.2),rgba(63,184,255,.03));box-shadow:0 0 14px rgba(63,184,255,.28)}

@keyframes sysIn{0%{opacity:0;transform:scaleY(.03);filter:brightness(2.6)}45%{opacity:1;transform:scaleY(1.04);filter:brightness(1.6)}70%{transform:scaleY(.99)}100%{opacity:1;transform:none;filter:none}}

/* falhas do Sistema: de vez em quando uma janela "pisca" com interferência */
.win.glitch{animation:glJit .46s steps(2,end) 1}
.win.glitch::before{display:block!important;content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border:0;width:auto;height:auto;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(190,240,255,.28) 5px 6px,transparent 6px 11px,rgba(120,214,255,.12) 11px 13px,transparent 13px 19px);mix-blend-mode:screen;animation:glLines .46s steps(3,end) 1}
@keyframes glJit{0%,100%{transform:none;filter:none}15%{transform:translateX(-5px) skewX(-2deg);filter:brightness(1.5) hue-rotate(-12deg)}30%{transform:translateX(4px);filter:brightness(.8)}45%{transform:translateX(-2px) skewX(1deg);filter:brightness(1.3)}60%{transform:translateX(1px)}}
@keyframes glLines{0%{opacity:.9;transform:translateY(-8px);clip-path:inset(10% 0 55% 0)}33%{opacity:.7;transform:translateY(6px);clip-path:inset(48% 0 18% 0)}66%{opacity:.85;clip-path:inset(25% 0 40% 0)}100%{opacity:0}}
/* iPhone: campo com letra menor que 16px faz a tela dar zoom ao tocar; e toque duplo não deve dar zoom */

function cargasBase(av,corpo){const bw=corpo&&corpo.peso>=30?corpo.peso:70,fx=av&&av.fis?av.flex||0:0,br=av&&av.fis?av.barra||0:0;
  const empE=fx>0?.64*bw*(1+fx/30):.45*bw,empP=br>0?bw*(1+br/30):.55*bw;
  return{bw,E:empE*.75*.6,P:empP*.75*.6,sexF:corpo&&corpo.sexo==='f'?.8:1}}
const NIVN=['iniciante','intermediário','avançado'];
function nivelF(av){if(!av||!av.fis)return 0;const f=av.flex||0,b=av.barra||0;return f>=30||(f>=20&&b>=10)?2:f>=10?1:0}
function calibrar(fichas,av,corpo){const lv=nivelF(av),bw=corpo&&corpo.peso>=30?corpo.peso:70,fx=(av&&av.flex)||0,ab=(av&&av.abd)||0,br=(av&&av.barra)||0;
  const CB=cargasBase(av,corpo);
  const rnd=x=>x<10?Math.max(1,Math.round(x)):Math.round(x/2.5)*2.5,cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  const setR=(e,r,n)=>{e.a=r;if(n)e.s=Array.from({length:n},()=>[0,r]);else e.s.forEach(y=>{y[1]=r})};
  fichas.forEach((f,fi)=>f.ex.forEach(e=>{const m=REL[e.n];
    if(m){const c=rnd(m[0]==='L'?CB.bw*m[1]*CB.sexF:CB[m[0]]*m[1]);e.s.forEach(y=>{y[0]=c})}
    else if(e.n==='Flexão de braço')setR(e,cl(Math.round((fx||[6,12,25][lv])*.6),3,30));
    else if(e.n==='Flexão de braço (máximo)')setR(e,Math.max(5,Math.round((fx||[6,12,25][lv])*1.1)));
    else if(e.n==='Abdominal supra'||e.n==='Abdominal remador')setR(e,cl(Math.round((ab||[15,25,40][lv])*.5),6,40));
    else if(e.n==='Abdominal supra (máximo)')setR(e,Math.max(10,Math.round((ab||[15,25,40][lv])*1.1)));
    else if(e.n==='Barra fixa'||e.n==='Barra fixa (negativas)'){if(br>=2){e.n='Barra fixa';setR(e,cl(Math.round(br*.6),1,12))}else{e.n='Barra fixa (negativas)';setR(e,3)}}
    else if(e.n==='Barra fixa (máximo)')setR(e,br+1);
    else if(e.n==='Agachamento (peso do corpo)')setR(e,[12,20,30][lv]);
    else if(e.n==='Burpee')setR(e,[5,10,15][lv]);
    else if(e.n==='Afundo alternado')setR(e,[8,12,16][lv]);
    else if(e.n==='Prancha')setR(e,[30,45,60][lv]);
    else if(e.n==='Corrida estacionária')setR(e,[20,30,45][lv]);
    else if(e.n==='Corrida contínua'){const km=av&&av.fis?av.km||0:0,b=km>0?cl(Math.round(km*6*.8/5)*5,10,40):[15,25,35][lv];setR(e,b+(fi===11?(b<20?5:10):0))}

    else if(e.n==='Corrida de 12 minutos (simulado)')setR(e,[2000,2400,2800][lv])}));
  return fichas}

  const g=c.createGain();g.gain.value=.22;src.connect(bp).connect(g).connect(c.destination);src.start(t);
  const o=c.createOscillator(),og=c.createGain();o.type='square';o.frequency.setValueAtTime(420+Math.random()*60,t);o.frequency.exponentialRampToValueAtTime(180,t+.018);

let pularTw=false;
function digitar(el,txt,vel){txt=tr(txt);return new Promise(res=>{if(!el){res();return}if(REDUZ||pularTw){el.textContent=txt;res();return}
  let i=0;el.textContent='';el.classList.add('on');const t=setInterval(()=>{if(pularTw||!el.isConnected){i=txt.length}else i++;el.textContent=txt.slice(0,i);const ch=txt[i-1];if(ch&&((vel||28)>=22||i%2===0))tique(ch);
    if(i>=txt.length){clearInterval(t);el.classList.remove('on');if(txt.length>12&&!pularTw)sino();res()}},vel||28)})}
const espera=ms=>new Promise(r=>setTimeout(r,REDUZ||pularTw?0:ms));
/* abertura coreografada: espera até o instante X da trilha (ms desde o toque) */
let t0Abertura=0;const ate=ms=>espera(Math.max(0,t0Abertura+ms-performance.now()));
const digitarEm=async(el,txt,ini,dur)=>{await ate(ini);return digitar(el,txt,Math.max(14,Math.min(60,dur/Math.max(1,tr(txt).length))))};

function tr1(s){if(Object.prototype.hasOwnProperty.call(EN,s))return EN[s];for(const[re,f]of EN_P){const m=s.match(re);if(m)return f(m)}return null}
function tr(s){if(S.lang!=='en'||s==null)return s;const t=String(s),k=t.trim();if(!k)return t;
  let r=tr1(k);if(r==null&&k.indexOf(', ')>0){const ps=k.split(', ');if(ps.every(p=>Object.prototype.hasOwnProperty.call(EN,p)))r=ps.map(p=>EN[p]).join(', ')}
  if(r==null&&k.indexOf(' · ')>0){const ps=k.split(' · '),tt=ps.map(p=>{const x=tr1(p);return x==null?p:x});if(tt.some((x,i)=>x!==ps[i]))r=tt.join(' · ')}
  return r==null?t:t.match(/^\s*/)[0]+r+t.match(/\s*$/)[0]}
function trDom(n){if(S.lang!=='en'||!n)return;
  if(n.nodeType===3){const v=n.nodeValue,r=tr(v);if(r!==v)n.nodeValue=r;return}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
  for(const a of ['placeholder','aria-label','title']){const v=n.getAttribute(a);if(v){const r=EN['@'+v]||tr(v);if(r!==v)n.setAttribute(a,r)}}
  if(n.tagName==='TEXTAREA')return;
  for(const c of [...n.childNodes])trDom(c)}
try{new MutationObserver(ms=>{if(S.lang!=='en')return;for(const m of ms)m.addedNodes.forEach(trDom)}).observe(document.body,{childList:true,subtree:true})}catch(_){}

const fila=[];let ntfAtivo=false;
function notificar(tipo,titulo,linhas,big){
  fila.push({tipo,titulo,linhas:linhas||[],big});
  S.log.unshift({t:Date.now(),k:tipo,m:titulo+(linhas&&linhas.length?' — '+linhas.join(' · '):'')});
  if(S.log.length>120)S.log.length=120;
  setTimeout(mostrarProx,60)}
function mostrarProx(){if(ntfAtivo||!fila.length)return;if(!$('awk').hidden){setTimeout(mostrarProx,700);return}const n=fila.shift();ntfAtivo=true;
  const ov=$('ntf');const red=n.tipo==='alerta';
  const head=tr('[SISTEMA] '+(red?'ALERTA':n.tipo==='lvl'?'LEVEL UP':n.tipo==='titulo'?'TÍTULO':'NOTIFICAÇÃO'));
  ov.innerHTML=`<div class="win ${red?'red':''}" role="alertdialog" aria-modal="true" aria-labelledby="nt-h">
    <div class="wh"><span class="ic">!</span><h2 id="nt-h">${head}</h2></div>

async function twNotif(ov){if(REDUZ)return;const ps=[...ov.querySelectorAll('.nt-body p')].map(p=>p.querySelector('b')||p),tx=ps.map(p=>p.textContent);
  ps.forEach(p=>{p.textContent='\u00a0'});await espera(320);for(let i=0;i<ps.length;i++){if(ov.hidden)return;await digitar(ps[i],tx[i],14)}}

function ganharXP(q){let subiu=false;let m=1;if(S.fadiga>=100)m=.5;const g=Math.round(q*m);S.xp+=g;S.xpTotal+=g;reg('xp',g);
  const rk0=rankJog(),rn0=rankDe(S.nivel);

}
  if(subiu)efeitoNivel();

  else if(rn1!==rn0&&rk1!==rn1)notificar('alerta','Promoção bloqueada',['Você tem nível para o rank '+rn1+', mas seu corpo ainda está no rank '+rk1+'.','Treine e faça o Exame de rank no Status.']);

  if(!S.chefe||S.chefe.sem!==sem){const ant=S.chefe;
    if(ant&&!ant.derrotado&&ant.dano>0&&S.despertado)notificar('alerta',CHEFES[ant.i][0]+' escapou',['Você causou '+nf(ant.dano)+' de '+nf(ant.hp)+' de dano.','Um novo chefe apareceu nesta semana.']);
    const i=((Math.floor(parseD(sem).getTime()/6048e5)%CHEFES.length)+CHEFES.length)%CHEFES.length;
    if(!S.chefeNiv||typeof S.chefeNiv!=='object')S.chefeNiv={};const lv=(S.chefeNiv[i]||0)+1;S.chefeNiv[i]=lv;

function bater(n){const C=chefeAtual();n=Math.round(n);if(C.derrotado||n<=0)return;C.dano=Math.min(C.hp,C.dano+n);

/* compatibilidade com o Sistema: sobe devagar com constância, cai rápido com falhas */
function mudarCompat(d){const a=S.compat;S.compat=Math.max(0,Math.min(100,a+d));const c=S.compat;
  if(d>0){if(c===100&&a<100){notificar('titulo','Compatibilidade: 100%',['O Sistema não se enganou.','Você é o escolhido.'],'100%');checarTitulos()}return}
  if(c===a)return;
  const msg=c===0?['Você falhou 100%.','Do player que eu escolhi, não sobrou nada. Prove que ainda existe alguém aí.']
    :c<40?['Do player que eu escolhi, quase nada sobrou.','Cada falha confirma o que eu temia.']
    :c<70?['Você está jogando fora a chance que recebeu.','Talvez outro player merecesse o seu lugar.']
    :c<90?['Talvez eu tenha me enganado sobre você.','Prove que eu estava certo.']
    :['Ainda acredito em você.','Não me faça duvidar.'];
  notificar('alerta','Compatibilidade caiu para '+c+'%',msg)}
function cumprirJur(id){const j=S.juramentos.find(x=>x.id===id),t=hoje();if(!j||j.concluido||j.ultimo===t)return;
  const M=metaJ(j);j.cont++;j.ultimo=t;if(j.cont===1)j.inicio=t;j.melhor=Math.max(j.melhor||0,j.cont);
  if(j.cont>=M){j.concluido=true;j.ciclos=(j.ciclos||0)+1;S.stats.juramentos++;const xp=M*10,ou=Math.round(M*5*ouroMult()),pt=M>=100?3:2;S.ouro+=ou;S.pontos+=pt;j.xpHoje=0;
    notificar('titulo','Juramento cumprido: '+j.nome,[M+' dias seguidos sem falhar um.','+'+xp+' XP · +'+ou+' G · +'+pt+' pontos de atributo'],M+' DIAS');ganharXP(xp);checarTitulos();return}

function setPlano(its){if(S.daily.dom)S.daily.semana=its;else S.daily.itens=its}
function checarDomingo(t){const dom=parseD(t).getDay()===0,D=S.daily;
  if(D.dom){D.itens=Array.isArray(D.semana)&&D.semana.length?D.semana:JSON.parse(JSON.stringify(DEF_ITENS));delete D.semana;D.dom=false}}
function rollover(){const t=hoje();if(S.despertado)checarDomingo(t);const jq=checarJuramentos();if(S.despertado)chefeAtual();
  if(!S.dia){S.dia=t;return jq}

  if(S.dia>t){S.dia=t;return true}
  let falhou=!S.daily.ok&&!isDescanso(S.dia);
  let d=addDias(S.dia,1),g=0;while(d<t&&g<400){if(!isDescanso(d))falhou=true;d=addDias(d,1);g++}
  {const pd=S.dia,its=S.daily.itens;if(pd&&its.length){const hh=S.hist[pd]||(S.hist[pd]={xp:0,foco:0,ok:0});hh.ex=Math.round(its.filter(it=>(S.daily.prog[it.id]||0)>=alvo(it)).length/its.length*100)}}
  S.dia=t;S.daily.prog={};S.daily.hora={};S.daily.ok=false;S.mp=mpMax();S.fadiga=0;
  if(S.treguaDia&&S.treguaDia<t)S.treguaDia=null;
  if(falhou){S.streak=0;const dano=Math.round(hpMax()*.3*(S.classe==='guardiao'?[.5,.45,.4,.3][tierC()]:1)*(S.dificil?2:1));S.hp=Math.max(1,S.hp-dano);
    if(!S.penalidade)S.penalidade={desde:t,prog:{}};
    notificar('alerta','Missão diária não cumprida',['Você foi enviado à Zona de Penalidade.','−'+dano+' HP · sequência zerada','Cumpra a missão de penalidade para sair.']);mudarCompat(-4)}
  else{S.hp=Math.min(hpMax(),S.hp+Math.round(hpMax()*.2*(1+(bonC('curandeiro')||0))))}
  notificar('info','Nova missão diária chegou',[isDescanso(t)?'Hoje é dia de descanso: concluir é opcional.':'Conclua tudo antes da meia-noite.']);
  return true}
function checarDiaria(){const its=S.daily.itens;if(S.daily.ok||!its.length)return;
  if(its.every(it=>(S.daily.prog[it.id]||0)>=alvo(it))){S.daily.ok=true;S.streak++;S.melhorStreak=Math.max(S.melhorStreak,S.streak);S.diasConcluidos++;
    const gb=S.ganbaruDia===S.dia;const xp=xpDiariaHoje(),ou=ouroDiaria();S.ouro+=ou;S.pontos+=1;S.hp=hpMax();S.mp=mpMax();if(gb)S.stats.ganbaru++;reg('ok',1);mudarCompat(1);
    notificar('info','Missão diária concluída',['+'+xp+' XP · +'+ou+' G · +1 ponto de atributo','Sequência: '+S.streak+' dia'+(S.streak>1?'s':'')].concat(gb?['Ganbaru: você foi mesmo sem vontade. +50% XP.']:[]));
    S.stats.leoes=(S.stats.leoes||0)+1;notificar('titulo',leaoHoje()[0]+' abatido',['Você matou o leão do dia.','Leões abatidos: '+S.stats.leoes]);bater(150);ganharXP(xp);checarTitulos()}}
const PEN_TREINO=[{id:'p-flex',nome:'Flexões',base:40,un:'rep',passo:5},{id:'p-abd',nome:'Abdominais',base:40,un:'rep',passo:5},{id:'p-agach',nome:'Agachamentos',base:40,un:'rep',passo:5},{id:'p-corr',nome:'Corrida',base:2,un:'km',passo:.5}];
function penTreino(){const a=S.aval||{},lv=nivelF(a),fx=a.fis&&a.flex?a.flex:[6,12,25][lv],ab=a.fis&&a.abd?a.abd:[15,25,40][lv],km=a.fis&&a.km?a.km:[1,2,4][lv],c=(v,x,y)=>Math.max(x,Math.min(y,v)),r5=v=>Math.round(v/5)*5;
  return[{id:'p-flex',nome:'Flexões',base:c(r5(fx*2.5),15,80),un:'rep',passo:5},{id:'p-abd',nome:'Abdominais',base:c(r5(ab*2),20,80),un:'rep',passo:5},{id:'p-agach',nome:'Agachamentos',base:[40,60,80][lv],un:'rep',passo:5},{id:'p-corr',nome:'Corrida',base:c(Math.round(km*.8*2)/2,1,4),un:'km',passo:.5}]}

function itensPenal(){return S.daily.itens.flatMap(it=>it.id==='treino'?penTreino().map(x=>({...x,alvoP:alvo(x,multPenal())})):[{...it,alvoP:alvo(it,multPenal())}])}
function checarPenal(){const P=S.penalidade;if(!P)return;const its=itensPenal();
  if(its.length&&its.every(it=>(P.prog[it.id]||0)>=it.alvoP)){S.penalidade=null;S.stats.penalidades++;S.hp=hpMax();
    notificar('info','Você sobreviveu à Zona de Penalidade',['HP restaurado. Não deixe acontecer de novo.']);checarTitulos()}}
function rolarLoot(r){const ri=RANKS.indexOf(r),n=1+Math.floor(ri/2),pb=(S.attrs.per-10)*.005+(S.classe==='sentinela'?[.05,.06,.07,.1][tierC()]:0),res={};

    const k=x<pT?'tregua':x<pC?'cristal':x<pM?'pedra':x<pP?'pocao':null;if(k){res[k]=(res[k]||0)+1;S.inv[k]++}}
  return res}

let ref=null,dbH=null,fbEnv=0,meuId=null,rkGlobal=null,rkUnsub=null,rkPode=null,rkGravando=false,rkUltimo='',cloudTimer=null,gravando=false,pendente=false;
function validar(o){if(!o||typeof o!=='object')return'estado vazio';
  const nums=['nivel','xp','xpTotal','ouro','pontos','hp','mp','fadiga','streak','diasConcluidos'];
  for(const k of nums)if(typeof o[k]!=='number'||!isFinite(o[k]))return k+' inválido';
  if(o.nivel<1||o.xp<0||o.ouro<0)return'valores negativos';
  if(!o.attrs||Object.values(o.attrs).some(v=>typeof v!=='number'||!isFinite(v)))return'atributos inválidos';
  if(!o.daily||!Array.isArray(o.daily.itens))return'missão diária inválida';
  for(const k of ['missoes','juramentos','log','titulos','questoes'])if(!Array.isArray(o[k]))return k+' inválido';
  return''}
let erroSalvo=false;
function salvar(){const v=validar(S);if(v){if(!erroSalvo){erroSalvo=true;avisoErro('O Sistema detectou um dado inválido ('+v+') e não salvou, para proteger seu progresso. Exporte um backup em Configurações.')}return}erroSalvo=false;
  S.atualizado=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(ref){clearTimeout(cloudTimer);cloudTimer=setTimeout(gravarNuvem,1200)}}
async function gravarNuvem(){if(!ref)return;if(gravando){pendente=true;return}gravando=true;
  try{await ref.set({estado:JSON.stringify(S),atualizado:S.atualizado});setSync(true);gravarRanking()}catch(e){setSync(false);if(e&&/invalid_argument|not_granted|revoked|permission/i.test(String(e.code||e.message||''))){ref=null;dbH=null;if(aba==='config')render()}}
  gravando=false;if(pendente){pendente=false;gravarNuvem()}}
function setSync(on){const el=$('sync');el.classList.toggle('on',on);el.lastElementChild.textContent=tr(on?'ATIVADO':'LOCAL');el.title=tr(on?'Progresso sincronizado na nuvem':'Progresso salvo só neste aparelho')}
async function puxarNuvem(){if(!ref)return;try{const sn=await ref.get();
  if(sn.exists){const d=sn.data();const r=hidratar(JSON.parse(d.estado));if((r.atualizado||0)>(S.atualizado||0)){S=r;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(rollover())salvar();render();iniciarDespertar()}else if(S.despertado&&(S.atualizado||0)>(r.atualizado||0))gravarNuvem()}
  else if(S.despertado)gravarNuvem();setSync(true)}catch(e){}}
(async function(){try{const c=window.claude;if(!c||!c.use)return;const[db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)return;

  const js=JSON.stringify(d);d.h=hashTx(js+'erga');let b64='';try{b64=btoa(unescape(encodeURIComponent(JSON.stringify(d))))}catch(_){}return'ERGA-'+b64}

function fecharPortao(){const ov=$('awk');ov.hidden=true;ov.classList.remove('gate');ov.innerHTML='';Trilha.ambiente();render();if(S.despertado&&!S.aval&&!wiz)setTimeout(()=>{if(!S.aval&&!wiz)abrirWiz('onb')},350)}
$('awk').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b){pularTw=true;return}liberarSom();const a=b.dataset.a;
  if(a==='conectar'){abertura();return}
  if(!Trilha.on)Trilha.start({amb:true});
  if(a==='pular'){pularTw=true;const ga=$('gate-act');if(ga)ga.classList.add('on');if(S.despertado&&!$('awk-nome')&&!$('awk-fim')&&!$('ev1'))fecharPortao();return}
  tocar('info');
  if(a==='rec')recusou();
  else if(a==='ac'){Trilha.impacto(.9);registro()}
  else if(a==='entrar')fecharPortao();
  else if(a==='reg'){awkNome=($('awk-nome').value||'').trim()||'Player';if(S.despertado){finalAbertura(S.nome||awkNome);return}passoClasse(awkNome)}
  else if(a==='cls'){awkCls=b.dataset.k;document.querySelectorAll('#awk .cls-b').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===awkCls));const inf=$('awk-cls-info');if(inf)inf.innerHTML=infoCls(awkCls);const f=$('awk-fim');if(f)f.disabled=false}
  else if(a==='fim'){if(!awkCls||!CLASSES[awkCls])return;if(S.despertado){finalAbertura(S.nome);return}const n=awkNome||'Player';S.nome=n;S.despertado=true;S.criado=Date.now();S.dia=hoje();
    escolherClasse(awkCls);checarDomingo(hoje());S.metaVida=(($('awk-meta')||{}).value||'').trim().slice(0,140);S.compat=awkCompat;S.hp=hpMax();S.mp=mpMax();
    S.kaizenDesde=hoje();S.ultimaAbertura=hoje();notificar('info','Bem-vindo, Player '+n+'.',['O Sistema vai acompanhar seu crescimento.','+1 [Poção de Recuperação] de boas-vindas']);
    aba='hoje';salvar();finalAbertura(n)}});
$('awk').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='awk-nome'){const b=$('awk').querySelector('[data-a="reg"]');b&&b.click()}});

/* ================= relógio ================= */
let tick=0;
setInterval(()=>{if(!S.despertado)return;
  if(S.portal&&S.portal.saiu&&document.visibilityState==='visible'){if(checarSelo()){salvar();render();return}}
  if(S.portal&&Date.now()>=S.portal.fim&&!S.portal.saiu){concluirPortal();salvar();render();return}
  const c=$('clk-dia');if(c)c.textContent=restanteDia();
  const p=$('clk-portal');if(p&&S.portal){const tot=S.portal.fim-S.portal.ini,rest=S.portal.fim-Date.now(),C=2*Math.PI*46;p.textContent=tempo(rest);const r=$('ring-portal');if(r)r.setAttribute('stroke-dashoffset',C*Math.max(0,rest/tot))}
  if(++tick%15===0&&rollover()){salvar();render()}},1000);

/* ================= feed de atividade ================= */
let feedI=0;const FEED_IC={lvl:'▲',titulo:'◆',alerta:'!',info:'✦'};
function feedTick(){const el=$('feed');if(!el)return;const L=(S.log||[]).filter(l=>l&&l.m).slice(0,8);
  if(!S.despertado||!L.length||!$('awk').hidden||!$('ntf').hidden){el.hidden=true;return}
  const l=L[feedI++%L.length],tt=String(l.m).split(' — ')[0];el.innerHTML='<i></i><span></span>';el.lastChild.textContent=(FEED_IC[l.k]||'✦')+' '+tr(tt);el.hidden=false;el.classList.remove('in');void el.offsetWidth;el.classList.add('in')}
setInterval(feedTick,6500);setTimeout(feedTick,1500);

/* ================= falhas do Sistema ================= */
function falha(el){if(REDUZ||!el)return;el.classList.remove('glitch');void el.offsetWidth;el.classList.add('glitch');setTimeout(()=>el.classList.remove('glitch'),520)}
(function loopFalha(){setTimeout(()=>{try{if(S.despertado&&(S.tema||'sistema')==='sistema'&&document.visibilityState==='visible'){const ws=[...document.querySelectorAll('#main>.win,#main>details.win')].filter(w=>{const r=w.getBoundingClientRect();return r.bottom>60&&r.top<innerHeight-60});if(ws.length)falha(ws[Math.floor(Math.random()*ws.length)])}}catch(_){}loopFalha()},6000+Math.random()*7000)})();

/* ================= início ================= */
const h0=(location.hash||'').slice(1);if(abaValida(h0))aba=h0;else{const g0=GRUPOS[h0]?h0:null;if(g0)aba=subDe(g0)}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(abaValida(h)&&h!==aba){aba=h;render()}});
if(S.despertado&&S.aval&&!S.juramentos.some(j=>j.fixo)){camaPadrao();salvar()}
if(S.despertado){checarSelo();if(S.portal&&Date.now()>=S.portal.fim)concluirPortal();if(rollover())salvar();if(S.portal)pedirWake()}
render();iniciarDespertar();
})();
</script>

<script>
(function(){

  document.body.appendChild(b);

  document.getElementById('pwa-no').onclick=function(){b.remove();try{localStorage.setItem('sj-inst-no',String(Date.now()))}catch(_){}};
 }
 window.ergaInstall=function(){
  if(dp&&!inApp){var e=dp;dp=null;e.prompt();var b=document.getElementById('pwa-inst');b&&b.remove();return}
  guia();
 };
 function fechar(){var g=document.getElementById('pwa-guia');g&&g.remove()}

   passos=[T('Toque nos <b>···</b> no canto de cima e escolha <b>Abrir no navegador externo</b>.','Tap <b>···</b> at the top and choose <b>Open in external browser</b>.'),T('No Safari, toque em <b>Compartilhar</b> (quadrado com a seta para cima).','In Safari, tap <b>Share</b> (square with an up arrow).'),T('Escolha <b>Adicionar à Tela de Início</b> e toque em <b>Adicionar</b>.','Choose <b>Add to Home Screen</b> and tap <b>Add</b>.')];

   passos=[T('Toque em <b>Compartilhar</b> (quadrado com a seta para cima), na barra do navegador.','Tap <b>Share</b> (square with an up arrow) in the browser bar.'),T('Role e escolha <b>Adicionar à Tela de Início</b>.','Scroll and choose <b>Add to Home Screen</b>.'),T('Toque em <b>Adicionar</b>. O ícone aparece na tela inicial.','Tap <b>Add</b>. The icon appears on your home screen.')];

   nota='<p style="margin:0 0 12px;color:#8fb3d1;font-size:13px">'+T('Não deu? Copie o link abaixo e cole no <b>Chrome</b>.','Did not work? Copy the link below and paste it in <b>Chrome</b>.')+'</p>';
